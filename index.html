<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Alex Santiago Guerra Cordoba" />
    <link rel="stylesheet" href="styles.css" />
    <title>landing-page</title>
  </head>
  <body>
    <header class="header">
      <section class="hero">
        <div class="container-spacing">
          <div class="hero-content">
            <div class="hero-navigation">
              <h2 class="hero-navigation__title">Header Logo</h2>
              <nav class="hero-navigation__nav">
                <a class="hero-navigation__link" href="">Info</a>
                <a class="hero-navigation__link" href="">Message</a>
                <a class="hero-navigation__link" href="">Footer</a>
              </nav>
            </div>
            <div class="hero-body">
              <div class="hero-body__content">
                <h1 class="hero-body__title">This website is awesome</h1>
                <p class="hero-body__paragraph">
                  This website has some subtext that goes here under the main
                  title. it's a smaller font and the color is lower contrast
                </p>
                <button class="hero-body__button">Sign Up</button>
              </div>
              <img
                class="hero-body__img"
                src="https://picsum.photos/seed/picsum/536/354"
                alt="static random image"
              />
            </div>
          </div>
        </div>
      </section>
    </header>
    <main class="main"></main>
    <footer></footer>
  </body>
</html>
